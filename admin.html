<style>
/* ===== THÊM MỚI: Menu trượt bên trái của admin (giống trang chính) ===== */
.adm-left{display:flex;align-items:center;gap:12px;min-width:0}
.adm-btn{flex:none;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:#f1f5f9;color:#334155;font-size:1.3rem;line-height:1;cursor:pointer}
.adm-btn[hidden]{display:none}
.adm-menu{position:fixed;left:0;top:80px;bottom:0;width:280px;max-width:85vw;z-index:9;background:#fff;border-right:1px solid #e2e8f0;box-shadow:4px 0 24px rgba(15,23,42,.08);padding:12px 20px;overflow-y:auto;transform:translateX(-100%);visibility:hidden;transition:transform .25s ease,visibility .25s}
.adm-menu.open{transform:none;visibility:visible}
.adm-menu a{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #f1f5f9;color:#334155;font-weight:500;text-decoration:none}
.adm-menu a:hover{color:#0284c7}
.adm-menu a.on{color:#0284c7;font-weight:700}
.adm-menu .nbadge{margin-left:auto;min-width:18px;padding:0 6px;border-radius:99px;background:#ef4444;color:#fff;font-size:.7rem;font-weight:700;line-height:18px;text-align:center}
@media(max-width:720px){.adm-menu{top:56px}}
</style>
</head>
<body class="adm pt-app font-sans text-slate-800 bg-slate-50 antialiased min-h-screen">
